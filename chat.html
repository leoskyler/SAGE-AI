<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>SAGE AI Chat</title>
<link rel="stylesheet" href="css/style.css">
</head>

<body>
    <div class="particles"></div>

<div class="container">

    <div class="logo">
    SAGE AI
</div>

<button id="loginBtn">
    <img
        src="https://www.gstatic.com/firebasejs/ui/2.0.0/images/auth/google.svg"
        alt="Google"
        class="google-icon"
    >
    Sign in with Google
</button>
<div class="tagline">
    Ask anything...
</div>
<div class="sage-orb"></div>

<div class="welcome">
    <h1>Hello! I'm <span>SAGE AI</span></h1>
    <p>How can I help you today?</p>
</div>
<!-- Welcome Section -->

<div class="welcome-section">

    <div class="sage-star">
        ✦
    </div>

    <h2>
        Hello! I'm <span>SAGE AI</span>
    </h2>

    <p>
        How can I help you today?
    </p>

</div>

<!-- Suggestions -->

<div class="suggestions">

    <button class="suggestion-btn">
        💡 Explain quantum computing
    </button>

    <button class="suggestion-btn">
        &lt;/&gt; Write Python code
    </button>

    <button class="suggestion-btn">
        📊 Analyze this data
    </button>

</div>

<!-- Hidden chat area -->

<div class="chat-box" id="chatBox"></div>

<!-- Hidden Upload Input -->

<input
    type="file"
    id="imageInput"
    accept="image/*,.pdf,.doc,.docx,.txt"
    style="display:none;"
>

<!-- Bottom Bar -->

<div class="input-wrapper">

    <button id="plusBtn">
    ✚
    </button>

    <button id="voiceBtn" onclick="startVoiceInput()">
        🎤
    </button>

    <input
        id="userInput"
        type="text"
        placeholder="Type your message..."
    >

    <button id="sendBtn">
        ➤
    </button>

</div>
    
</div>

<script src="js/app.js"></script>
<script type="module" src="js/firebase.js"></script>

</body>
</html>
